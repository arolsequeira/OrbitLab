<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initia-scale=1.0" />
    <title>OrbitLab</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>OrbitLab</h1>
                <p class="tagline">Interactive Kinematics Simulator</p>
            </header>

            <div class="control-group">
                <label for="velocity">Launch Velocity (v₀) <span id="val-velocity">35m/s</span></label>
                <input type="range" id="velocity" min="5" max="100" value="35" step="1" />
                

            </div>

            <div class="control-group">
                <label for="angle">Launch Angle (θ) <span id="val-angle">45°</span></label>
                <input type="range" id="angle" min="0" max="90" value="45" step="1" />
            </div>

            <div class="control-group">
                <label for="gravity">Gravity (g) <span id="val-gravity">9.8m/s²</span></label>
                <input type="range" id="gravity" min="1.6" max="25" value="9.8" step="0.1" />
            </div>

            <div class="control-group">
                <label for="height">Platform Height (h₀) <span id="val-height">0 m</span></label>
                <input type="range" id="height" min="0" max="5" value="0" step="1" />
            </div>

            <div class="action-buttons">
                <button id="btn-fire" class="btn primary">Launch </button>
                <button id="btn-reset" class="btn secondary">Reset</button>
            </div>

            <section class="telemetery">
                <h2> Live Telemetry </h2>
                <div class="metric">
                    <span class="label"> Time Of Flight</span>
                    <span class="value" id="tel-flight">0.00 s</span>

                </div>
                <div class="metric">
                    <span class="label"> Max Height</span>
                    <span class="value" id="tel-height">0.00 m</span>
                </div>
                <div class="metric">
                    <span class="label"> Range</span>
                    <span class="value" id="tel-range">0.00 m</span>
                </div>
            </section>
        </aside>

        <main class="viewport">
            <canvas id="sim-canvas"></canvas>
        </main>
        
    </div>
    <script src="app.js?v=1"></script></script>
</body>
</html>
